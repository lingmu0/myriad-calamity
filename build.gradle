plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            // -PrunDir=<folder> keeps a verification run away from the normal client world.
            workingDirectory project.findProperty('runDir') ? project.file(project.property('runDir')) : project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

repositories {
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

// Pure Java geometry/state checks: no game launch or third-party test dependencies.
tasks.register('combatTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.xuwu.myriadcalamity.CombatMathTest'
}
tasks.register('animationTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.xuwu.myriadcalamity.AnimationPlaybackTest'
}
tasks.register('yangJianCombatTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.xuwu.myriadcalamity.YangJianCombatTest'
}
tasks.register('cloudArenaTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.xuwu.myriadcalamity.world.CloudArenaDataTest'
}
tasks.register('yangJianEffectsTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.xuwu.myriadcalamity.YangJianEffectsTest'
}
tasks.register('yangJianHazardTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.xuwu.myriadcalamity.YangJianHazardTest'
}
tasks.register('yangJianDefenseTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.xuwu.myriadcalamity.YangJianDefenseTest'
}
tasks.register('yangJianTransitionTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.xuwu.myriadcalamity.YangJianTransitionTest'
}
tasks.register('yangJianBeamAimTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.xuwu.myriadcalamity.YangJianBeamAimTest'
}
tasks.register('battleMusicTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.xuwu.myriadcalamity.BattleMusicRulesTest'
}
tasks.named('check') { dependsOn 'combatTest', 'animationTest', 'yangJianCombatTest', 'cloudArenaTest', 'yangJianEffectsTest', 'yangJianHazardTest', 'yangJianDefenseTest', 'yangJianTransitionTest', 'yangJianBeamAimTest', 'battleMusicTest' }
// Tests instantiate NBT and SavedData only; they do not launch a client or server.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

// The mod metadata lives in a template so src/main/resources stays byte-identical to the JAR.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var keys = ['minecraft_version_range','forge_version_range','loader_version_range','mod_id','mod_name','mod_license','mod_version','mod_authors','mod_description']
    var values = keys.collectEntries { [(it): project.property(it)] }
    inputs.properties values
    filteringCharset = 'UTF-8'
    expand values
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '2000']
}
