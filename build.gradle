plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var keys = ['minecraft_version_range','neo_version_range','loader_version_range','mod_id','mod_name','mod_license','mod_version','mod_authors','mod_description']
    var values = keys.collectEntries { [(it): project.property(it)] }
    inputs.properties values
    filteringCharset = 'UTF-8'
    expand values
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
// Pure Java geometry/state checks: no game launch or third-party test dependencies.
tasks.register('combatTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.xuwu.myriadcalamity.CombatMathTest'
}
tasks.register('animationTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.xuwu.myriadcalamity.AnimationPlaybackTest'
}
tasks.named('check') { dependsOn 'combatTest', 'animationTest' }
// Tests instantiate NBT and SavedData only; they do not launch a client or server.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
