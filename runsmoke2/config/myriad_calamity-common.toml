
[cogworkDancer]
	#Shared maximum health of a newly summoned Cogwork Dancer pair.
	#Range: 1.0 ~ 1000000.0
	health = 480.0
	#Base attack damage. Individual moves scale from their normal damage around this value.
	#Range: 0.1 ~ 1000.0
	damage = 9.0

[yangJian]
	#Maximum health for a newly started Yang Jian challenge.
	#Range: 1.0 ~ 1000000.0
	health = 640.0
	#Base damage for all three phases; each move keeps its own damage multiplier.
	#Range: 0.1 ~ 1000.0
	damage = 9.0
	#P1 defense bar. Exhausting this bar starts the transition to P2.
	#Range: 1.0 ~ 1000000.0
	guard = 180.0
	#P2 defense bar restored after the transition. Exhausting it starts P3.
	#Range: 1.0 ~ 1000000.0
	phase2Guard = 220.0
	#P3 defense bar. After it is exhausted, health damage is enabled until the bar recovers.
	#Range: 1.0 ~ 1000000.0
	phase3Guard = 260.0
	#Minimum fraction of maximum health retained when P3 begins. Higher remaining health is preserved.
	#Range: 0.0 ~ 1.0
	phase3HealthFloor = 0.4
	#Draw Yang Jian's ground attack-range indicators. When disabled (default) only the
	#phase-two transition slam is still warned; every other move leaves no ground marker, and
	#phase-three falling strikes reveal their impact area with blade and lightning effects
	#instead of warning circles.
	showAttackIndicators = false
	#Maximum health of a newly summoned celestial hound.
	#Range: 1.0 ~ 100000.0
	houndHealth = 40.0
	#Base celestial hound pounce damage.
	#Range: 0.1 ~ 1000.0
	houndDamage = 5.0

